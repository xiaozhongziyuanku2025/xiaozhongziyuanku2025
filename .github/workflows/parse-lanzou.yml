name: 蓝奏云排错测试

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 运行刚才写的 Python 脚本
        env:
          FOLDER_URL: "https://wwbmd.lanzout.com/b011mmapdg"
          LANZOU_COOKIE: ${{ secrets.LANZOU_COOKIE }}
        run: python test.py
