name: 更新 Release 缓存

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取并生成缓存
        run: |
          RELEASES=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases)

          FINAL_JSON=$(echo "$RELEASES" | jq '
            [.[] | select(.tag_name | startswith("Windows病毒库"))] as $releases |
            $releases | map(
              .tag_name as $tag |
              ($tag | sub("^Windows病毒库"; "") | sub("^-"; "") | split("-") | join("/")) as $subpath |
              ($subpath | if . == "" then "" else . end) as $path |
              .assets[] |
              {
                name: .name,
                decoded_name: (
                  (.name | split(".")) as $parts |
                  if ($parts | length) > 1 then
                    (($parts[0:-1] | join("")) | try (gsub("-"; "+") | gsub("_"; "/") | @base64d) catch null) as $whole |
                    if $whole then
                      $whole + "." + $parts[-1]
                    else
                      (($parts[0:-1] | map(
                        . as $seg |
                        ($seg | try (gsub("-"; "+") | gsub("_"; "/") | @base64d) catch $seg)
                      ) | join(".")) + "." + $parts[-1])
                    end
                  else
                    (.name | try (gsub("-"; "+") | gsub("_"; "/") | @base64d) catch .)
                  end
                ),
                path: $path,
                size: .size,
                download_url: .browser_download_url
              }
            ) as $files |
            {
              version: "1.0",
              updated_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
              files: $files
            }
          ')

          echo "$FINAL_JSON" > release-cache.json
          echo "✅ 缓存已生成，共 $(echo "$FINAL_JSON" | jq '.files | length') 个文件"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-cache.json
          git diff --staged --quiet || git commit -m "chore: 自动更新 Release 缓存 [skip ci]"
          git push
