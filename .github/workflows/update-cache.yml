name: 更新 Release 缓存

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5   # v4 → v5，消除 Node.js 20 警告
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取并生成缓存
        run: |
          RELEASES=$(curl -s -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases)

          FINAL_JSON=$(echo "$RELEASES" | jq '
            [.[] | select(.tag_name | startswith("Windows病毒库"))] as $releases |
            $releases | map(
              .tag_name as $tag |
              ($tag | sub("^Windows病毒库"; "") | sub("^-"; "") | split("-") | join("/")) as $subpath |
              ($subpath | if . == "" then "Windows病毒库" else "Windows病毒库/" + . end) as $path |
              .assets[] |
              {
                name: .name,
                decoded_name: (
                  (.name | split(".") | .[0:-1] | join(".")) as $base |
                  ($base | gsub("-"; "+") | gsub("_"; "/") | @base64d? // $base) as $decoded_base |
                  if .name | contains(".") then $decoded_base + "." + (.name | split(".")[-1]) else $decoded_base end
                ),
                path: $path,
                size: .size,
                download_url: .browser_download_url
              }
            ) as $files |
            {
              version: "1.0",
              updated_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")),
              files: $files
            }
          ')

          echo "$FINAL_JSON" > release-cache.json
          echo "✅ 缓存已生成，共 $(echo "$FINAL_JSON" | jq '.files | length') 个文件"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-cache.json
          git diff --staged --quiet || git commit -m "chore: 自动更新 Release 缓存 [skip ci]"
          git push
