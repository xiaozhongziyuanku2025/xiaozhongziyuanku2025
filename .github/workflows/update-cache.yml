name: 更新 Release 缓存

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取并生成缓存
        run: |
          echo "开始获取 Releases (支持翻页)..."
          RELEASES="[]"
          PAGE=1
          while true; do
            BATCH=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page=$PAGE")
            COUNT=$(echo "$BATCH" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then break; fi
            RELEASES=$(echo "$RELEASES $BATCH" | jq -s 'add')
            if [ "$COUNT" -lt 100 ]; then break; fi
            PAGE=$((PAGE+1))
          done

          echo "获取完成，开始生成 JSON..."
          FINAL_JSON=$(echo "$RELEASES" | jq '
            # 解析所有 tag
            .[] | 
            .tag_name as $tag |
            # 直接保留原前缀，将 - 转为 / 实现真实层级
            ($tag | split("-") | join("/")) as $path |
            .assets[] |
            {
              name: .name,
              decoded_name: (
                (.name | split(".")) as $parts |
                if ($parts | length) > 1 then
                  (($parts[0:-1] | join("")) | try (gsub("-"; "+") | gsub("_"; "/") | @base64d) catch null) as $whole |
                  if $whole then
                    $whole + "." + $parts[-1]
                  else
                    (($parts[0:-1] | map(
                      . as $seg |
                      ($seg | try (gsub("-"; "+") | gsub("_"; "/") | @base64d) catch $seg)
                    ) | join(".")) + "." + $parts[-1])
                  end
                else
                  (.name | try (gsub("-"; "+") | gsub("_"; "/") | @base64d) catch .)
                end
              ),
              path: $path,
              tag: $tag,
              size: .size,
              updated_at: .updated_at,
              download_url: .browser_download_url
            }
          ' | jq -s '{ version: "1.0", updated_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), files: . }')

          echo "$FINAL_JSON" > release-cache.json
          echo "✅ 缓存已生成，共 $(echo "$FINAL_JSON" | jq '.files | length') 个文件"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-cache.json
          git diff --staged --quiet || git commit -m "chore: 自动更新 Release 缓存 [skip ci]"
          git push
