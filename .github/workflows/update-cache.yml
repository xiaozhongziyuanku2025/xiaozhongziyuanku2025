name: 更新 Release 缓存

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取并生成缓存
        run: |
          echo "开始获取 Releases (支持翻页)..."
          RELEASES="[]"
          PAGE=1
          while true; do
            BATCH=$(curl -s -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page=$PAGE")
            COUNT=$(echo "$BATCH" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then break; fi
            RELEASES=$(echo "$RELEASES $BATCH" | jq -s 'add')
            if [ "$COUNT" -lt 100 ]; then break; fi
            PAGE=$((PAGE+1))
          done

          echo "获取完成，开始生成 JSON..."
          FINAL_JSON=$(echo "$RELEASES" | jq '
            def decode_base_str:
              try (gsub("-"; "+") | gsub("_"; "/") | @base64d) catch .;
            
            def decode_filename:
              split(".") as $parts |
              if ($parts | length) > 1 then
                (($parts[0:-1] | join("")) | decode_base_str) as $whole |
                if $whole != ($parts[0:-1] | join("")) then
                  $whole + "." + $parts[-1]
                else
                  (($parts[0:-1] | map(decode_base_str)) | join(".")) + "." + $parts[-1]
                end
              else
                decode_base_str
              end;
            
            def decode_name:
              if test("\\.\\d+$") then
                capture("(?<base>.*)\\.(?<num>\\d+)$") as $m |
                ($m.base | decode_filename) + "." + $m.num
              else
                decode_filename
              end;
          
            [.[] | .tag_name as $tag | 
             ( $tag | split("-") | join("/") ) as $path | 
             .assets[] | 
             .name as $name |
             {
               name: $name,
               decoded_name: ($name | decode_name),
               path: $path,
               tag: $tag,
               size: .size,
               updated_at: .updated_at,
               download_url: .browser_download_url
             }
            ] | 
            { version: "1.0", updated_at: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), files: . }
          ')

          echo "$FINAL_JSON" > release-cache.json
          echo "✅ 缓存已生成，共 $(echo "$FINAL_JSON" | jq '.files | length') 个文件"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-cache.json
          git diff --staged --quiet || git commit -m "chore: 自动更新 Release 缓存 [skip ci]"
          git push
