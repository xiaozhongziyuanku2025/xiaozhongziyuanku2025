name: 蓝奏云拟真解析

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  parse-lanzou:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Playwright 及隐身插件
        run: |
          pip install playwright playwright-stealth
          python -m playwright install chromium --with-deps

      - name: 运行拟真浏览器解析
        env:
          FOLDER_URL: "https://wwbmd.lanzout.com/b011mmapdg"
          GLOBAL_PWD: "1234"
          LANZOU_COOKIE: ${{ secrets.LANZOU_COOKIE }}
        run: python fetch_lanzou.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lanzou-cache.json
          git diff --staged --quiet || git commit -m "chore: 自动更新蓝奏云层级缓存 [skip ci]"
          git push
