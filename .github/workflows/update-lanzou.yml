name: 蓝奏云混合架构解析

on:
  workflow_dispatch:

jobs:
  parse-lanzou:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖及浏览器
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install chromium --with-deps

      - name: 运行混合架构解析
        env:
          LANZOU_ACCOUNT: ${{ secrets.LANZOU_ACCOUNT }}
          LANZOU_PASSWORD: ${{ secrets.LANZOU_PASSWORD }}
        run: python fetch_lanzou.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先拉取最新代码并变基，防止和 Pages 构建冲突
          git pull origin main --rebase
          git add lanzou-cache.json
          git diff --staged --quiet || git commit -m "chore: 自动更新蓝奏云缓存 [skip ci]"
          git push origin main

      - name: 上传失败截图供排查
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore
