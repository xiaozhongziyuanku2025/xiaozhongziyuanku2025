name: 蓝奏云混合架构解析

on:
  workflow_dispatch: # 只有手动触发

jobs:
  parse-lanzou:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖及浏览器
        run: |
          # 升级 pip 并安装 requests 和 playwright
          python -m pip install --upgrade pip
          pip install requests playwright
          
          # 安装 Chromium 浏览器及系统依赖
          python -m playwright install chromium --with-deps

      - name: 运行混合架构解析
        env:
          # 从 Secrets 读取账号和密码
          LANZOU_ACCOUNT: ${{ secrets.LANZOU_ACCOUNT }}
          LANZOU_PASSWORD: ${{ secrets.LANZOU_PASSWORD }}
        run: python fetch_lanzou.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lanzou-cache.json
          git diff --staged --quiet || git commit -m "chore: 混合架构更新蓝奏云缓存 [skip ci]"
          git push
          
      - name: 上传失败截图供排查 (如果有)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            *.html
