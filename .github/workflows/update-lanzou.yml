name: 蓝奏云账号登录抓取

on:
  workflow_dispatch: # 仅支持手动触发

jobs:
  parse-lanzou:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库与浏览器
        run: |
          # 升级 pip 并安装所需的 Python 库
          python -m pip install --upgrade pip
          pip install playwright ddddocr
          
          # 为 Playwright 安装 Chromium 浏览器及其系统依赖
          python -m playwright install chromium --with-deps

      - name: 运行账号登录解析
        env:
          LANZOU_ACCOUNT: ${{ secrets.LANZOU_ACCOUNT }}
          LANZOU_PASSWORD: ${{ secrets.LANZOU_PASSWORD }}
        run: python fetch_lanzou.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lanzou-cache.json
          git diff --staged --quiet || git commit -m "chore: 账号登录更新蓝奏云缓存 [skip ci]"
          git push
          
      - name: 上传失败截图和源码供查看
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: |
            login_failed.png
            login_failed.html
