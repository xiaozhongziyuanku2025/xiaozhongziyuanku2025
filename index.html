<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows病毒库 - 小众资源库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 相同的样式代码，添加文件列表样式 */
        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .file-item {
            background: rgba(30, 30, 40, 0.8);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s;
        }
        
        .file-item:hover {
            transform: translateY(-5px);
        }
        
        .download-link {
            color: #4CAF50;
            text-decoration: none;
            display: block;
        }
        
        .warning-message {
            background: rgba(255, 87, 34, 0.2);
            border: 1px solid rgba(255, 87, 34, 0.5);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-controls">
                <button class="nav-toggle" id="navToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <h1 class="site-title">Windows病毒库</h1>
        </header>
        
        <div class="main-content">
            <div class="sidebar" id="sidebar">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="../index.html" class="nav-link">关于作者</a>
                    </li>
                    <li class="nav-item">
                        <a href="../resources/index.html" class="nav-link">资源库</a>
                    </li>
                    <li class="nav-item">
                        <a href="../main-resources/index.html" class="nav-link">← 返回</a>
                    </li>
                </ul>
            </div>
            
            <div class="content-area">
                <div class="warning-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <strong>警告：</strong> 此文件夹包含病毒样本，请在虚拟机或隔离环境中运行！
                </div>
                
                <div class="file-list">
                    <div class="file-item">
                        <a href="https://buzzheavier.com/blmbkqzbjvkz" class="download-link" target="_blank">
                            <div class="file-icon">EXE</div>
                            <div class="file-name">000.exe</div>
                            <div class="file-details">111KB</div>
                        </a>
                    </div>
                    <!-- 其他4个文件 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
</body>
</html>
