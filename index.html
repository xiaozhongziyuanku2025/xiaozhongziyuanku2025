        /* 相同的样式代码 */
        .folder-container {
            margin-top: 30px;

        .folder {
            display: inline-block;

            text-align: center;
            margin: 15px;
            cursor: pointer;
            transition: transform 0.3s;
            text-decoration: none;
            color: inherit;
        }
        
        .folder:hover {
            transform: translateY(-5px);
        }
        
        .folder-icon {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 10px;
            margin: 0 auto 10px;
        }
        
        .folder-name {

        }
