<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源库 - 小众资源库</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h2 class="password-title">请输入私密文件夹密码</h2>
            <input type="password" class="password-input" id="passwordInput" placeholder="请输入密码...">
            <div class="password-error" id="passwordError">密码错误，请重试！</div>
            <div class="password-buttons">
                <button class="password-submit" id="passwordSubmit">确认</button>
                <button class="password-cancel" id="passwordCancel">取消</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <div class="header-controls">
                <button class="nav-toggle" id="navToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <button class="back-button" id="backButton">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <button class="forward-button" id="forwardButton">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            <h1 class="site-title">小众资源库</h1>
        </header>
        
        <div class="main-content">
            <div class="sidebar" id="sidebar">
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">
                            <i class="fas fa-user"></i> 关于作者
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="resources.html" class="nav-link active">
                            <i class="fas fa-folder"></i> 资源库
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="mailto:cn.2345.com@gmail.com" class="nav-link">
                            <i class="fas fa-envelope"></i> 联系作者
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="content-area">
                <h2>资源库</h2>
                
                <!-- 面包屑导航 -->
                <div class="breadcrumb" id="breadcrumb">
                    <div class="breadcrumb-item" data-level="0">首页</div>
                </div>
                
                <!-- 搜索功能 -->
                <div class="search-container">
                    <button class="search-icon" id="searchToggle">
                        <i class="fas fa-search"></i>
                    </button>
                    <div class="search-bar" id="searchBar">
                        <input type="text" class="search-input" placeholder="请在此处键入搜索" id="searchInput">
                    </div>
                </div>
                
                <!-- 搜索结果 -->
                <div class="search-results" id="searchResults">
                    <h3>搜索结果</h3>
                    <div class="file-list" id="resultsList"></div>
                </div>
                
                <!-- 文件夹列表 -->
                <div class="folder-content active">
                    <div class="folder-container">
                        <!-- Windows病毒库文件夹 -->
                        <a href="windows-virus.html" class="folder-link">
                            <div class="folder" data-folder="windows-virus">
                                <div class="folder-icon"></div>
                                <div class="folder-name">Windows病毒库</div>
                            </div>
                        </a>
                        
                        <!-- 私密文件夹 -->
                        <div class="folder private-folder" id="privateFolderBtn">
                            <div class="private-folder-icon"></div>
                            <div class="folder-name">私密文件夹</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        // 私密文件夹点击事件
        document.getElementById('privateFolderBtn').addEventListener('click', function() {
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('passwordInput').focus();
        });
        
        // 密码验证
        document.getElementById('passwordSubmit').addEventListener('click', function() {
            const password = document.getElementById('passwordInput').value;
            if (password === '123456') {
                window.location.href = 'private-folder.html';
            } else {
                document.getElementById('passwordError').style.display = 'block';
            }
        });
        
        document.getElementById('passwordCancel').addEventListener('click', function() {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').style.display = 'none';
        });
    </script>
</body>
</html>
