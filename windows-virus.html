    <script>
        // ================================================================
        //  完整版：层级目录 + 正确IP检测 + 国家判断
        // ================================================================

        const PROXY_MAP = {
            'gh-proxy.org': 'https://gh-proxy.org/',
            'ghproxy.net': 'https://ghproxy.net/',
            'gh-proxy.com': 'https://gh-proxy.com/',
            'ghproxy.cc': 'https://ghproxy.cc/'
        };
        const DEFAULT_PROXY_KEY = 'ghproxy.net';

        let userCountry = 'OTHER';
        let allFiles = [];
        let selectedFiles = new Set();
        let selectMode = false;
        let isProxyAuto = true;
        let currentProxyKey = 'none';
        let currentPath = '';

        const container = document.getElementById('fileListContainer');
        const statsDiv = document.getElementById('fileStats');
        const filePart = document.getElementById('crumbFilePart');

        function decodeFilename(encoded) {
            if (!encoded) return encoded;
            try {
                let lastDot = encoded.lastIndexOf('.');
                let ext = lastDot > 0 ? encoded.substring(lastDot) : '';
                let name = lastDot > 0 ? encoded.substring(0, lastDot) : encoded;
                let base64 = name.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                let decoded = atob(base64);
                decoded = decodeURIComponent(escape(decoded));
                return decoded + ext;
            } catch(e) { return encoded; }
        }

        function formatSize(bytes) {
            if (!bytes) return '未知';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
            });
        }

        // ================================================================
        //  IP检测 + 国家判断（缓存 + 并发）
        // ================================================================
        async function detectCountry() {
            const cached = sessionStorage.getItem('userCountry');
            if (cached) {
                userCountry = cached;
                return cached;
            }

            const apis = [
                {
                    url: 'https://ipinfo.io/json',
                    timeout: 3000,
                    parser: (data) => data && data.country ? data.country.toUpperCase() : null
                },
                {
                    url: 'https://ip-api.com/json/',
                    timeout: 4000,
                    parser: (data) => data && data.status === 'success' && data.countryCode ? data.countryCode.toUpperCase() : null
                }
            ];

            const fetchWithTimeout = (url, timeout) => {
                return Promise.race([
                    fetch(url),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('超时')), timeout))
                ]);
            };

            const results = await Promise.allSettled(
                apis.map(async (api) => {
                    try {
                        const res = await fetchWithTimeout(api.url, api.timeout);
                        if (!res.ok) return null;
                        const data = await res.json();
                        return api.parser(data);
                    } catch (e) { return null; }
                })
            );

            for (const result of results) {
                if (result.status === 'fulfilled' && result.value) {
                    const country = result.value;
                    if (country === 'CN' || country.length === 2) {
                        sessionStorage.setItem('userCountry', country);
                        userCountry = country;
                        return country;
                    }
                }
            }

            sessionStorage.setItem('userCountry', 'OTHER');
            userCountry = 'OTHER';
            return 'OTHER';
        }

        // ================================================================
        //  根据国家应用代理
        // ================================================================
        function applyProxyByCountry(country) {
            const statusEl = document.getElementById('proxyStatus');
            const selectEl = document.getElementById('proxySelect');

            if (country === 'CN') {
                currentProxyKey = DEFAULT_PROXY_KEY;
                selectEl.value = 'auto';
                statusEl.textContent = '🇨🇳 国内用户 · 已启用加速';
                statusEl.className = 'proxy-status success';
                showProxyTip('🇨🇳 检测到您在中国，已启用国内加速代理');
                isProxyAuto = true;
            } else {
                currentProxyKey = 'none';
                selectEl.value = 'none';
                statusEl.textContent = '🌍 国外用户 · 直连模式';
                statusEl.className = 'proxy-status info';
                showProxyTip('🌍 检测到您在境外，使用直连模式');
                isProxyAuto = true;
            }
            updateZipLinks();
            renderCurrentPath();
        }

        // ================================================================
        //  手动切换代理
        // ================================================================
        function handleManualProxyChange(key) {
            isProxyAuto = false;
            currentProxyKey = key;
            const statusEl = document.getElementById('proxyStatus');
            statusEl.textContent = '🖐️ 手动: ' + key;
            statusEl.className = 'proxy-status info';
            updateZipLinks();
            renderCurrentPath();
            showProxyTip('🔗 手动切换到: ' + key);
        }

        // ================================================================
        //  提示条
        // ================================================================
        function showProxyTip(msg, isError = false) {
            const existing = document.querySelector('.proxy-tip');
            if (existing) existing.remove();
            const tip = document.createElement('div');
            tip.className = 'proxy-tip';
            tip.innerHTML = `<span class="tip-icon">${isError ? '⚠️' : '✅'}</span><span>${msg}</span><span class="tip-close">&times;</span>`;
            if (isError) tip.style.borderColor = 'rgba(244,67,54,0.5)';
            document.body.appendChild(tip);
            tip.querySelector('.tip-close').addEventListener('click', function() { tip.remove(); });
            setTimeout(() => { if (tip.parentNode) tip.remove(); }, 6000);
        }

        // ================================================================
        //  代理逻辑
        // ================================================================
        function getProxyPrefix(key) {
            if (key === 'none') return '';
            if (key === 'auto') return PROXY_MAP[currentProxyKey] || '';
            return PROXY_MAP[key] || '';
        }

        function getDownloadUrl(originalUrl) {
            const prefix = getProxyPrefix(currentProxyKey);
            return prefix ? prefix + originalUrl : originalUrl;
        }

        function updateZipLinks() {
            const base = 'https://github.com/xiaozhongziyuanku2025/xiaozhongziyuanku2025/archive/refs/heads/main';
            const zipLink = document.getElementById('zipLink');
            const tarLink = document.getElementById('tarLink');
            const prefix = getProxyPrefix(currentProxyKey);
            zipLink.href = (prefix ? prefix : '') + base + '.zip';
            tarLink.href = (prefix ? prefix : '') + base + '.tar.gz';
        }

        function downloadFile(originalUrl, encodedName) {
            const decoded = decodeFilename(encodedName);
            const finalUrl = getDownloadUrl(originalUrl);
            const a = document.createElement('a');
            a.href = finalUrl;
            a.download = decoded;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // ================================================================
        //  测速（仅用于手动测速，不覆盖自动决策）
        // ================================================================
        async function speedTest() {
            const statusEl = document.getElementById('proxyStatus');
            statusEl.textContent = '⏳ 测速中...';
            statusEl.className = 'proxy-status loading';

            const testFile = 'https://github.com/xiaozhongziyuanku2025/xiaozhongziyuanku2025/releases/download/Windows%E7%97%85%E6%AF%92%E5%BA%93/0Y4.exe';
            const results = {};
            const proxyKeys = Object.keys(PROXY_MAP);

            for (let key of proxyKeys) {
                const url = PROXY_MAP[key] + testFile;
                const start = performance.now();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(url, { signal: controller.signal, headers: { 'Range': 'bytes=0-1024' } });
                    clearTimeout(timeoutId);
                    if (!res.ok) { results[key] = Infinity; continue; }
                    const reader = res.body.getReader();
                    await reader.read();
                    reader.releaseLock();
                    results[key] = performance.now() - start;
                } catch (e) {
                    results[key] = Infinity;
                }
            }

            const valid = Object.keys(results).filter(k => results[k] !== Infinity);
            if (valid.length === 0) {
                statusEl.textContent = '⚠️ 测速失败';
                statusEl.className = 'proxy-status error';
                showProxyTip('⚠️ 测速失败，请检查网络', true);
                return;
            }

            valid.sort((a, b) => results[a] - results[b]);
            const fastest = valid[0];
            statusEl.textContent = '✅ 最快: ' + fastest + ' (' + Math.round(results[fastest]) + 'ms)';
            statusEl.className = 'proxy-status success';
            showProxyTip('🏆 测速完成，最快: ' + fastest + ' (' + Math.round(results[fastest]) + 'ms)');
        }

        // ================================================================
        //  层级目录核心函数
        // ================================================================
        function buildFileTree(files) {
            const tree = {};
            const rootFiles = [];
            files.forEach(file => {
                const path = file.path || '';
                const normalizedPath = path.trim().replace(/\/+$/, '') + (path ? '/' : '');
                const parts = normalizedPath.split('/').filter(p => p.length > 0);
                if (parts.length === 0) { rootFiles.push(file); return; }
                let current = tree;
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    if (i === parts.length - 1) {
                        if (!current[part]) current[part] = [];
                        if (Array.isArray(current[part])) {
                            current[part].push(file);
                        } else {
                            if (!current[part]._files) current[part]._files = [];
                            current[part]._files.push(file);
                        }
                    } else {
                        if (!current[part]) current[part] = {};
                        if (Array.isArray(current[part])) {
                            const existingFiles = current[part];
                            current[part] = { _files: existingFiles };
                        }
                        current = current[part];
                    }
                }
            });
            return { tree, rootFiles };
        }

        function getPathContent(tree, rootFiles, path) {
            if (!path || path === '') {
                const folders = Object.keys(tree).filter(k => !k.startsWith('_'));
                return { folders, files: rootFiles };
            }
            const parts = path.split('/').filter(p => p.length > 0);
            let current = tree;
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                if (!current[part]) return { folders: [], files: [] };
                if (i === parts.length - 1) {
                    const node = current[part];
                    if (Array.isArray(node)) return { folders: [], files: node };
                    else {
                        const folders = Object.keys(node).filter(k => !k.startsWith('_'));
                        const files = node._files || [];
                        return { folders, files };
                    }
                } else {
                    current = current[part];
                    if (Array.isArray(current)) return { folders: [], files: [] };
                }
            }
            return { folders: [], files: [] };
        }

        function getBreadcrumbParts(path) {
            if (!path) return [];
            return path.split('/').filter(p => p.length > 0);
        }

        function navigateTo(path) {
            currentPath = path || '';
            renderCurrentPath();
        }

        // ================================================================
        //  渲染：文件夹 + 文件
        // ================================================================
        function renderCurrentPath() {
            if (!allFiles.length) {
                container.innerHTML = '<div class="loading">📁 暂无文件</div>';
                statsDiv.innerHTML = '📁 暂无文件';
                updateFileBreadcrumb([]);
                return;
            }

            const { tree, rootFiles } = buildFileTree(allFiles);
            const content = getPathContent(tree, rootFiles, currentPath);
            const totalFiles = content.files.length;
            const totalFolders = content.folders.length;
            statsDiv.innerHTML = `<i class="fas fa-chart-bar"></i> 共 ${totalFiles} 个文件，${totalFolders} 个文件夹`;

            const parts = getBreadcrumbParts(currentPath);
            updateFileBreadcrumb(parts);

            let html = '';

            // 渲染文件夹
            if (content.folders.length > 0) {
                content.folders.forEach(folderName => {
                    const subPath = currentPath ? currentPath + '/' + folderName : folderName;
                    const subContent = getPathContent(tree, rootFiles, subPath);
                    const count = subContent.files.length;
                    html += `
                        <div class="folder-item" data-path="${escapeHtml(subPath)}">
                            <div class="folder-icon" style="width:60px;height:60px;flex-shrink:0;"></div>
                            <div class="folder-name">${escapeHtml(folderName)}</div>
                            <div class="folder-count">${count} 个文件</div>
                        </div>
                    `;
                });
            }

            // 渲染文件
            if (content.files.length > 0) {
                content.files.forEach(file => {
                    const isSel = selectedFiles.has(file);
                    const displayName = file.decoded_name || decodeFilename(file.name);
                    const originalUrl = file.download_url || file.browser_download_url || '';
                    html += `
                        <div class="file-item ${selectMode ? 'selectable' : ''} ${isSel ? ' selected' : ''}"
                             data-filename="${escapeHtml(file.name)}"
                             data-url="${escapeHtml(originalUrl)}">
                            <div class="file-icon" style="width:60px;height:60px;margin:0 auto 10px;"></div>
                            <div class="file-name">${escapeHtml(displayName)}</div>
                            <div class="file-details">${formatSize(file.size)} ${selectMode ? '| 点击选中' : '| 点击下载'}</div>
                        </div>
                    `;
                });
            }

            if (content.folders.length === 0 && content.files.length === 0) {
                html = `<div class="empty-folder"><i class="fas fa-folder-open"></i>此目录为空</div>`;
            }

            container.innerHTML = html;

            // 绑定文件夹点击
            container.querySelectorAll('.folder-item').forEach(el => {
                el.addEventListener('click', function() {
                    const path = this.dataset.path;
                    if (path) navigateTo(path);
                });
            });

            // 绑定文件点击
            container.querySelectorAll('.file-item').forEach(item => {
                item.removeEventListener('click', handleFileClick);
                item.addEventListener('click', handleFileClick);
            });

            updateUI();
        }

        function handleFileClick(e) {
            const item = e.currentTarget;
            const originalUrl = item.dataset.url;
            const filename = item.dataset.filename;

            if (selectMode) {
                const file = allFiles.find(f => f.name === filename);
                if (file) {
                    if (selectedFiles.has(file)) {
                        selectedFiles.delete(file);
                        item.classList.remove('selected');
                    } else {
                        selectedFiles.add(file);
                        item.classList.add('selected');
                    }
                    updateUI();
                }
            } else {
                if (originalUrl && filename) downloadFile(originalUrl, filename);
            }
        }

        // ================================================================
        //  面包屑（后段：文件层级）
        // ================================================================
        function updateFileBreadcrumb(parts) {
            let html = `<span class="crumb-home" data-path="" data-level="-1"><i class="fas fa-home"></i> 根目录</span>`;
            let cumulativePath = '';
            parts.forEach((part, index) => {
                cumulativePath = cumulativePath ? cumulativePath + '/' + part : part;
                const isLast = index === parts.length - 1;
                if (isLast) {
                    html += `<span class="crumb-sep"> / </span>`;
                    html += `<span class="crumb-current"><i class="fas fa-folder-open crumb-folder-icon"></i>${escapeHtml(part)}</span>`;
                } else {
                    html += `<span class="crumb-sep"> / </span>`;
                    html += `<span class="crumb-item" data-path="${escapeHtml(cumulativePath)}">${escapeHtml(part)}</span>`;
                }
            });
            filePart.innerHTML = html;

            filePart.querySelectorAll('.crumb-home, .crumb-item').forEach(el => {
                el.addEventListener('click', function() {
                    const path = this.dataset.path || '';
                    navigateTo(path);
                });
            });
        }

        // ================================================================
        //  多选 UI
        // ================================================================
        function updateUI() {
            const count = selectedFiles.size;
            document.getElementById('selectedCounter').innerText = count;
            document.getElementById('selectedCount').innerText = count;
            const btn = document.getElementById('downloadSelectedBtn');
            if (btn) btn.style.display = count > 0 ? 'flex' : 'none';
        }

        function enterSelectMode() {
            selectMode = true;
            document.body.classList.add('select-mode');
            document.getElementById('selectModeBtn').style.display = 'none';
            document.getElementById('batchToolbar').classList.add('active');
            renderCurrentPath();
            updateUI();
        }

        function exitSelectMode() {
            selectMode = false;
            selectedFiles.clear();
            document.body.classList.remove('select-mode');
            document.getElementById('selectModeBtn').style.display = 'flex';
            document.getElementById('batchToolbar').classList.remove('active');
            renderCurrentPath();
            updateUI();
        }

        function selectAll() {
            const { tree, rootFiles } = buildFileTree(allFiles);
            const content = getPathContent(tree, rootFiles, currentPath);
            content.files.forEach(f => selectedFiles.add(f));
            renderCurrentPath();
            updateUI();
        }

        function clearSel() {
            selectedFiles.clear();
            renderCurrentPath();
            updateUI();
        }

        // ================================================================
        //  批量下载
        // ================================================================
        function showBatchModal() {
            if (selectedFiles.size === 0) return;
            document.getElementById('modalSelectedCount').innerText = selectedFiles.size;
            const list = document.getElementById('modalFileList');
            list.innerHTML = '';
            selectedFiles.forEach(f => {
                const div = document.createElement('div');
                div.className = 'selected-item';
                const name = f.decoded_name || decodeFilename(f.name);
                div.innerHTML = '<i class="fas fa-file"></i> ' + escapeHtml(name);
                list.appendChild(div);
            });
            document.getElementById('batchModal').classList.add('active');
        }

        function closeModal() { document.getElementById('batchModal').classList.remove('active'); }

        function batchDownloadBrowser() {
            const files = Array.from(selectedFiles);
            if (files.length === 0) return;
            showProxyTip('📥 正在打开 ' + files.length + ' 个下载链接...');
            const progressDiv = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressDiv.classList.add('active');
            let completed = 0;
            files.forEach((file, i) => {
                setTimeout(() => {
                    const finalUrl = getDownloadUrl(file.download_url || file.browser_download_url || '');
                    window.open(finalUrl, '_blank');
                    completed++;
                    progressFill.style.width = (completed / files.length * 100) + '%';
                    progressText.innerText = '已打开 ' + completed + '/' + files.length + ' 个下载';
                    if (completed === files.length) {
                        setTimeout(() => { progressDiv.classList.remove('active'); }, 2000);
                    }
                }, i * 600);
            });
            closeModal();
        }

        // ================================================================
        //  加载文件
        // ================================================================
        async function loadFiles() {
            try {
                const res = await fetch('release-cache.json?_=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.files && Array.isArray(data.files)) {
                        allFiles = data.files;
                    } else if (Array.isArray(data)) {
                        allFiles = data;
                    } else {
                        throw new Error('缓存格式错误');
                    }
                    allFiles = allFiles.map(f => {
                        if (!f.path) f.path = '';
                        if (!f.decoded_name) f.decoded_name = decodeFilename(f.name);
                        if (!f.download_url && f.browser_download_url) f.download_url = f.browser_download_url;
                        return f;
                    });
                    renderCurrentPath();
                    return;
                }
                console.log('缓存无效，尝试从 API 获取...');
                const apiRes = await fetch('https://api.github.com/repos/xiaozhongziyuanku2025/xiaozhongziyuanku2025/releases/tags/Windows病毒库');
                if (apiRes.ok) {
                    const apiData = await apiRes.json();
                    if (apiData.assets && apiData.assets.length) {
                        allFiles = apiData.assets.map(asset => ({
                            name: asset.name,
                            size: asset.size,
                            download_url: asset.browser_download_url,
                            path: '',
                            decoded_name: decodeFilename(asset.name)
                        }));
                        renderCurrentPath();
                        return;
                    }
                }
                throw new Error('无数据');
            } catch(e) {
                container.innerHTML = '<div class="error">加载失败，请刷新或稍后再试</div>';
                statsDiv.innerHTML = '加载失败';
                console.error(e);
            }
        }

        // ================================================================
        //  搜索
        // ================================================================
        function initSearch() {
            const toggle = document.getElementById('searchToggle');
            const bar = document.getElementById('searchBar');
            const input = document.getElementById('searchInput');
            const results = document.getElementById('searchResults');
            const list = document.getElementById('resultsList');
            const mainList = container;
            const hint = document.getElementById('searchHint');

            toggle.addEventListener('click', function() {
                bar.classList.toggle('active');
                if (bar.classList.contains('active')) {
                    input.focus();
                    hint.style.display = 'none';
                } else {
                    input.value = '';
                    results.classList.remove('active');
                    mainList.style.display = 'block';
                    hint.style.display = 'inline';
                }
            });

            hint.addEventListener('mouseenter', function() {
                if (!bar.classList.contains('active')) this.style.color = '#4CAF50';
            });
            hint.addEventListener('mouseleave', function() {
                if (!bar.classList.contains('active')) this.style.color = '#888';
            });

            input.addEventListener('input', function() {
                const kw = this.value.toLowerCase().trim();
                if (!kw) {
                    results.classList.remove('active');
                    mainList.style.display = 'block';
                    return;
                }
                mainList.style.display = 'none';
                results.classList.add('active');
                const matched = allFiles.filter(f => {
                    const name = f.decoded_name || decodeFilename(f.name);
                    return name.toLowerCase().includes(kw);
                });
                if (matched.length) {
                    list.innerHTML = matched.map(f => {
                        const originalUrl = f.download_url || f.browser_download_url || '';
                        const name = f.decoded_name || decodeFilename(f.name);
                        return `<div class="file-item" onclick="downloadFile('${originalUrl}', '${f.name}')"><div class="file-icon" style="width:60px;height:60px;margin:0 auto 10px;"></div><div class="file-name">${escapeHtml(name)}</div><div class="file-details">${formatSize(f.size)} | 点击下载</div></div>`;
                    }).join('');
                } else {
                    list.innerHTML = '<div style="text-align:center;padding:40px">😔 没有找到相关文件</div>';
                }
            });
        }

        // ================================================================
        //  导航和菜单
        // ================================================================
        document.getElementById('navToggle').addEventListener('click', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        document.getElementById('sidebarOverlay').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            this.classList.remove('active');
        });

        document.getElementById('backButton').addEventListener('click', function() { history.back(); });
        document.getElementById('forwardButton').addEventListener('click', function() { history.forward(); });

        // ================================================================
        //  按钮绑定
        // ================================================================
        document.getElementById('selectModeBtn').addEventListener('click', enterSelectMode);
        document.getElementById('exitSelectModeBtn').addEventListener('click', exitSelectMode);
        document.getElementById('selectAllBtn').addEventListener('click', selectAll);
        document.getElementById('clearSelectionBtn').addEventListener('click', clearSel);
        document.getElementById('downloadSelectedBtn').addEventListener('click', showBatchModal);
        document.getElementById('confirmDownload').addEventListener('click', batchDownloadBrowser);
        document.getElementById('cancelDownload').addEventListener('click', closeModal);

        document.getElementById('proxySelect').addEventListener('change', function() {
            const val = this.value;
            if (val === 'auto') {
                isProxyAuto = true;
                applyProxyByCountry(userCountry);
            } else {
                handleManualProxyChange(val);
            }
        });

        document.getElementById('speedTestBtn').addEventListener('click', function() {
            speedTest();
        });

        // ================================================================
        //  🚀 启动
        // ================================================================
        (async function init() {
            const statusEl = document.getElementById('proxyStatus');
            statusEl.textContent = '⏳ 检测IP...';
            statusEl.className = 'proxy-status loading';

            const country = await detectCountry();
            applyProxyByCountry(country);
            await loadFiles();
            initSearch();
            updateZipLinks();

            console.log('✅ 初始化完成，代理:', currentProxyKey, '国家:', userCountry);
        })();
    </script>
