                <!-- 批量操作栏 -->

                    <span style="color:#aaa;margin-right:10px;">下载源码包：</span>
                    <a class="zip-btn" id="zipLink" href="#" target="_blank"><i class="fas fa-file-archive"></i> .zip</a>

                </div>

                <!-- 搜索、文件列表 -->

    <script src="js/main.js"></script>
    <script>
        // ========== 核心变量 ==========
        let allFiles = [];
        let selectedFiles = new Set();
        let selectMode = false;
        let userCountry = 'OTHER';
        const PROXY_LIST = [
            'https://ghproxy.net/',
            'https://gh-proxy.com/',
            'https://ghproxy.cc/'
        ];
        let currentProxyIndex = 0; // 用于轮询切换

        // ========== 解码 Base64 ==========
        function decodeFilename(encoded) { /* 同前 */ }

        // ========== IP检测 ==========
        async function detectCountry() { /* 同前 */ }

        // ========== 获取有效代理（轮询） ==========
        function getProxyPrefix() {
            // 简单轮询，每次取一个，如果失败自动切换到下一个
            const proxy = PROXY_LIST[currentProxyIndex % PROXY_LIST.length];
            currentProxyIndex++;
            return proxy;
        }

        // ========== 生成下载链接（带代理） ==========
        function getDownloadUrl(originalUrl) {
            if (userCountry === 'CN') {
                // 使用当前轮询到的代理（可缓存有效代理，但为简单，每次取新）
                return getProxyPrefix() + originalUrl;
            }
            return originalUrl;
        }

        // ========== 下载单个文件（自动解码） ==========
        function downloadFile(url, encodedName) { /* 同前，但使用 getDownloadUrl */ }

        // ========== 批量下载（浏览器） ==========
        async function batchDownloadBrowser() { /* 同前 */ }

        // ========== 发送到 Aria2 ==========
        async function sendToAria2() {
            const files = Array.from(selectedFiles);
            if (files.length === 0) return;
            const rpcUrl = document.getElementById('aria2Rpc').value.trim();
            const secret = document.getElementById('aria2Secret').value.trim();
            if (!rpcUrl) {
                alert('请填写 Aria2 RPC 地址');
                return;
            }
            // 构造 JSON-RPC 请求
            for (const file of files) {
                const url = getDownloadUrl(file.browser_download_url);
                const decodedName = decodeFilename(file.name);
                const params = [url];
                const options = { out: decodedName }; // 指定文件名
                const payload = {
                    jsonrpc: '2.0',
                    method: 'aria2.addUri',
                    id: '1',
                    params: [params, options]
                };
                if (secret) {
                    payload.params.push({ 'secret': secret });
                }
                try {
                    const response = await fetch(rpcUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if (result.error) {
                        console.error(`Aria2 错误 (${file.name}):`, result.error);
                    } else {
                        console.log(`✅ 已发送到 Aria2: ${decodedName}`);
                    }
                } catch (e) {
                    console.error(`发送失败 (${file.name}):`, e);
                }
            }
            alert(`已将 ${files.length} 个文件发送到 Aria2，请查看 Aria2 任务列表。`);
            exitSelectMode();
        }

        // ========== 压缩下载（GitHub 源码包） ==========
        function setupZipLinks() {
            const baseUrl = 'https://github.com/xiaozhongziyuanku2025/xiaozhongziyuanku2025/archive/refs/heads/main';
            const zip = document.getElementById('zipLink');
            const tar = document.getElementById('tarLink');
            if (userCountry === 'CN') {
                zip.href = getProxyPrefix() + baseUrl + '.zip';
                tar.href = getProxyPrefix() + baseUrl + '.tar.gz';
            } else {
                zip.href = baseUrl + '.zip';
                tar.href = baseUrl + '.tar.gz';
            }
        }

        // ========== 渲染文件列表 ==========
        function renderFiles() { /* 同前，注意使用 getDownloadUrl 生成 data-url */ }

        // ========== 加载文件、搜索、事件绑定 ==========
        // ... 与之前相同，新增 Aria2 按钮事件

        // ========== 初始化 ==========

            await detectCountry();
            await loadFiles();
            initSearch();

            // 绑定 Aria2 按钮
            document.getElementById('aria2SelectedBtn').addEventListener('click', sendToAria2);
            // 多选模式按钮（增强）
            // ... 其他绑定同前
        })();
    </script>
