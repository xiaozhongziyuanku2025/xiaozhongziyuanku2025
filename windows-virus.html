    <style>

        .file-icon { width: 60px; height: 60px; margin: 0 auto 10px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23667eea"><path d="M6 2c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6H6z"/></svg>') no-repeat center; background-size: contain; }

        .proxy-tip { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e1e2e; color: #e0e0e0; padding: 12px 28px; border-radius: 10px; font-size: 14px; z-index: 9999; box-shadow: 0 4px 24px rgba(0,0,0,0.6); border: 1px solid rgba(76,175,80,0.3); animation: slideUp 0.4s ease; display: flex; align-items: center; gap: 12px; max-width: 90%; }
        .proxy-tip .tip-icon { font-size: 20px; }
        .proxy-tip .tip-close { cursor: pointer; opacity: 0.6; padding: 0 6px; font-size: 18px; }
        .proxy-tip .tip-close:hover { opacity: 1; }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        @media (max-width: 768px) {
            .sidebar { display: none; position: fixed; top: 0; left: 0; height: 100%; width: 280px; background: rgba(20,20,30,0.95); z-index: 1000; padding: 20px; overflow-y: auto; }
            .sidebar.active { display: block; }
            .file-list { grid-template-columns: 1fr; }
            .batch-controls { flex-direction: column; }
            .batch-btn { width: 100%; justify-content: center; }
            .search-bar { width: 100%; }
            .search-container { flex-wrap: wrap; }
            .proxy-tip { bottom: 15px; padding: 10px 16px; font-size: 13px; }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  修复版 JavaScript - 完整保留所有功能
        //  修复内容：IP检测（并行+超时+缓存）+ 真实测速 + 提示条
        // ================================================================

        const PROXY_MAP = {
            'gh-proxy.org': 'https://gh-proxy.org/',
            'ghproxy.net': 'https://ghproxy.net/',
            'gh-proxy.com': 'https://gh-proxy.com/',
            'ghproxy.cc': 'https://ghproxy.cc/'
        };
        const DEFAULT_PROXY_KEY = 'gh-proxy.org';
        const SPEED_TEST_FILE = 'https://github.com/xiaozhongziyuanku2025/xiaozhongziyuanku2025/releases/download/Windows%E7%97%85%E6%AF%92%E5%BA%93/0Y4.exe';

        let userCountry = 'OTHER';
        let allFiles = [];
        let selectedFiles = new Set();
        let selectMode = false;
        let bestProxyKey = DEFAULT_PROXY_KEY;
        let isProxyAuto = true;

        function decodeFilename(encoded) {
            if (!encoded) return encoded;
            try {
                let lastDot = encoded.lastIndexOf('.');
                let ext = lastDot > 0 ? encoded.substring(lastDot) : '';
                let name = lastDot > 0 ? encoded.substring(0, lastDot) : encoded;
                let base64 = name.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                let decoded = atob(base64);
                decoded = decodeURIComponent(escape(decoded));
                return decoded + ext;
            } catch(e) { return encoded; }
        }

        function formatSize(bytes) {
            if (!bytes) return '未知';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
            });
        }

        async function detectCountry() {
            const cached = sessionStorage.getItem('userCountry');
            if (cached) {
                userCountry = cached;
                console.log('📦 使用缓存IP:', userCountry);
                return userCountry;
            }

            const apis = [
                { url: 'https://ipapi.co/json/', parser: (d) => d.country_code || d.country || '' },
                { url: 'https://ipinfo.io/json', parser: (d) => d.country || '' },
                { url: 'https://api.ipify.org?format=json', parser: () => '' }
            ];

            const fetchWithTimeout = (url, timeout = 3000) => {
                return Promise.race([
                    fetch(url),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('超时')), timeout))
                ]);
            };

            const promises = apis.map(async (api) => {
                try {
                    const res = await fetchWithTimeout(api.url);
                    if (!res.ok) return null;
                    const data = await res.json();
                    const country = api.parser(data);
                    if (country && country.length === 2) {
                        return country.toUpperCase();
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            });

            const results = await Promise.all(promises);
            for (let result of results) {
                if (result) {
                    userCountry = result;
                    sessionStorage.setItem('userCountry', result);
                    console.log('✅ IP检测成功:', result);
                    return result;
                }
            }

            userCountry = 'OTHER';
            sessionStorage.setItem('userCountry', 'OTHER');
            console.warn('⚠️ IP检测失败，默认直连');
            return 'OTHER';
        }

        async function speedTest() {
            const statusEl = document.getElementById('proxyStatus');
            statusEl.textContent = '⏳ 测速中...';
            statusEl.className = 'proxy-status loading';

            const proxyKeys = Object.keys(PROXY_MAP);
            const results = {};

            const testPromises = proxyKeys.map(async (key) => {
                const url = PROXY_MAP[key] + SPEED_TEST_FILE;
                const start = performance.now();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(url, {
                        signal: controller.signal,
                        headers: { 'Range': 'bytes=0-1024' }
                    });
                    clearTimeout(timeoutId);
                    if (!res.ok) { results[key] = Infinity; return; }
                    const reader = res.body.getReader();
                    await reader.read();
                    reader.releaseLock();
                    const end = performance.now();
                    results[key] = end - start;
                } catch (e) {
                    results[key] = Infinity;
                }
            });

            await Promise.allSettled(testPromises);

            const valid = Object.keys(results).filter(k => results[k] !== Infinity);
            if (valid.length === 0) {
                bestProxyKey = DEFAULT_PROXY_KEY;
                statusEl.textContent = '⚠️ 测速失败，使用默认代理';
                statusEl.className = 'proxy-status error';
                return;
            }

            valid.sort((a, b) => results[a] - results[b]);
            bestProxyKey = valid[0];
            const latency = Math.round(results[bestProxyKey]);
            statusEl.textContent = '✅ 最快: ' + bestProxyKey + ' (' + latency + 'ms)';
            statusEl.className = 'proxy-status success';

            if (isProxyAuto) {
                document.getElementById('proxySelect').value = 'auto';
                renderFiles();
                updateZipLinks();
                showProxyTip('🚀 自动切换到最快代理: ' + bestProxyKey + ' (' + latency + 'ms)');
            }
            console.log('🏆 测速完成，最快:', bestProxyKey, latency + 'ms');
        }

        function showProxyTip(msg, isError = false) {
            const existing = document.querySelector('.proxy-tip');
            if (existing) existing.remove();

            const tip = document.createElement('div');
            tip.className = 'proxy-tip';
            tip.innerHTML = `
                <span class="tip-icon">${isError ? '⚠️' : '✅'}</span>
                <span>${msg}</span>
                <span class="tip-close">&times;</span>
            `;
            if (isError) tip.style.borderColor = 'rgba(244,67,54,0.5)';
            document.body.appendChild(tip);
            tip.querySelector('.tip-close').addEventListener('click', function() { tip.remove(); });
            setTimeout(() => { if (tip.parentNode) tip.remove(); }, 8000);
        }

        function getSelectedProxyKey() {
            return document.getElementById('proxySelect').value;
        }

        function getProxyPrefix(key) {
            if (key === 'none') return '';
            if (key === 'auto') return PROXY_MAP[bestProxyKey] || '';
            return PROXY_MAP[key] || '';
        }

        function getDownloadUrl(originalUrl) {
            const mode = getSelectedProxyKey();
            if (mode === 'none') return originalUrl;
            const prefix = getProxyPrefix(mode);
            return prefix ? prefix + originalUrl : originalUrl;
        }

        function updateZipLinks() {
            const base = 'https://github.com/xiaozhongziyuanku2025/xiaozhongziyuanku2025/archive/refs/heads/main';
            const zipLink = document.getElementById('zipLink');
            const tarLink = document.getElementById('tarLink');
            const prefix = getProxyPrefix(getSelectedProxyKey());
            zipLink.href = (prefix ? prefix : '') + base + '.zip';
            tarLink.href = (prefix ? prefix : '') + base + '.tar.gz';
        }

        function downloadFile(originalUrl, encodedName) {
            const decoded = decodeFilename(encodedName);
            const finalUrl = getDownloadUrl(originalUrl);
            const a = document.createElement('a');
            a.href = finalUrl;
            a.download = decoded;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function renderFiles() {
            const container = document.getElementById('fileList');
            const statsDiv = document.getElementById('fileStats');

            if (!allFiles.length) {
                container.innerHTML = '<div class="loading">📁 暂无文件</div>';
                statsDiv.innerHTML = '📁 暂无文件';
                return;
            }

            statsDiv.innerHTML = '<i class="fas fa-chart-bar"></i> 共 ' + allFiles.length + ' 个文件';

            container.innerHTML = allFiles.map(function(file) {
                const decoded = decodeFilename(file.name);
                const isSel = selectedFiles.has(file);
                const originalUrl = file.browser_download_url;
                return '<div class="file-item ' + (selectMode ? 'selectable' : '') + (isSel ? ' selected' : '') + '" data-filename="' + escapeHtml(file.name) + '" data-url="' + escapeHtml(originalUrl) + '"><div class="file-icon"></div><div class="file-name">' + escapeHtml(decoded) + '</div><div class="file-details">' + formatSize(file.size) + (selectMode ? ' | 点击选中' : ' | 点击下载') + '</div></div>';
            }).join('');

            bindEvents();
        }

        function bindEvents() {
            document.querySelectorAll('#fileList .file-item').forEach(function(item) {
                item.removeEventListener('click', handleClick);
                item.addEventListener('click', handleClick);
            });
        }

        function handleClick(e) {
            var item = e.currentTarget;
            var originalUrl = item.dataset.url;
            var filename = item.dataset.filename;

            if (selectMode) {
                var file = allFiles.find(function(f) { return f.name === filename; });
                if (selectedFiles.has(file)) {
                    selectedFiles.delete(file);
                    item.classList.remove('selected');
                } else {
                    selectedFiles.add(file);
                    item.classList.add('selected');
                }
                updateUI();
            } else {
                if (originalUrl && filename) downloadFile(originalUrl, filename);
            }
        }

        function updateUI() {
            var count = selectedFiles.size;
            document.getElementById('selectedCounter').innerText = count;
            document.getElementById('selectedCount').innerText = count;
            var btn = document.getElementById('downloadSelectedBtn');
            if (btn) btn.style.display = count > 0 ? 'flex' : 'none';
        }

        function enterSelectMode() {
            selectMode = true;
            document.body.classList.add('select-mode');
            document.getElementById('selectModeBtn').style.display = 'none';
            document.getElementById('batchToolbar').classList.add('active');
            renderFiles();
            updateUI();
        }

        function exitSelectMode() {
            selectMode = false;
            selectedFiles.clear();
            document.body.classList.remove('select-mode');
            document.getElementById('selectModeBtn').style.display = 'flex';
            document.getElementById('batchToolbar').classList.remove('active');
            renderFiles();
            updateUI();
        }

        function selectAll() { allFiles.forEach(function(f) { selectedFiles.add(f); }); renderFiles(); updateUI(); }
        function clearSel() { selectedFiles.clear(); renderFiles(); updateUI(); }

        function showBatchModal() {
            if (selectedFiles.size === 0) return;
            document.getElementById('modalSelectedCount').innerText = selectedFiles.size;
            var list = document.getElementById('modalFileList');
            list.innerHTML = '';
            selectedFiles.forEach(function(f) {
                var div = document.createElement('div');
                div.className = 'selected-item';
                div.innerHTML = '<i class="fas fa-file"></i> ' + escapeHtml(decodeFilename(f.name));
                list.appendChild(div);
            });
            document.getElementById('batchModal').classList.add('active');
        }

        function closeModal() { document.getElementById('batchModal').classList.remove('active'); }

        function batchDownloadBrowser() {
            var files = Array.from(selectedFiles);
            if (files.length === 0) return;
            showProxyTip('📥 正在打开 ' + files.length + ' 个下载链接...');
            var progressDiv = document.getElementById('progressBar');
            var progressFill = document.getElementById('progressFill');
            var progressText = document.getElementById('progressText');
            progressDiv.classList.add('active');
            var completed = 0;
            files.forEach(function(file, i) {
                setTimeout(function() {
                    var finalUrl = getDownloadUrl(file.browser_download_url);
                    window.open(finalUrl, '_blank');
                    completed++;
                    progressFill.style.width = (completed / files.length * 100) + '%';
                    progressText.innerText = '已打开 ' + completed + '/' + files.length + ' 个下载';
                    if (completed === files.length) {
                        setTimeout(function() { progressDiv.classList.remove('active'); }, 2000);
                    }
                }, i * 600);
            });
            closeModal();
        }

        async function loadFiles() {
            var container = document.getElementById('fileList');
            try {
                var res = await fetch('release-cache.json?_=' + Date.now());
                if (res.ok) {
                    var data = await res.json();
                    if (data.assets && data.assets.length) {
                        allFiles = data.assets;
                        renderFiles();
                        return;
                    }
                }
                console.log('缓存无效，尝试从 API 获取...');
                var apiRes = await fetch('https://api.github.com/repos/xiaozhongziyuanku2025/xiaozhongziyuanku2025/releases/tags/Windows病毒库');
                if (apiRes.ok) {
                    var apiData = await apiRes.json();
                    if (apiData.assets && apiData.assets.length) {
                        allFiles = apiData.assets;
                        renderFiles();
                        return;
                    }
                }
                throw new Error('无数据');
            } catch(e) {
                container.innerHTML = '<div class="error">加载失败，请刷新或稍后再试</div>';
                document.getElementById('fileStats').innerHTML = '加载失败';
            }
        }

        function initSearch() {
            var toggle = document.getElementById('searchToggle');
            var bar = document.getElementById('searchBar');
            var input = document.getElementById('searchInput');
            var results = document.getElementById('searchResults');
            var list = document.getElementById('resultsList');
            var mainList = document.getElementById('fileList');
            var hint = document.getElementById('searchHint');

            toggle.addEventListener('click', function() {
                bar.classList.toggle('active');
                if (bar.classList.contains('active')) {
                    input.focus();
                    hint.style.display = 'none';
                } else {
                    input.value = '';
                    results.classList.remove('active');
                    mainList.style.display = 'grid';
                    hint.style.display = 'inline';
                }
            });

            hint.addEventListener('mouseenter', function() {
                if (!bar.classList.contains('active')) this.style.color = '#4CAF50';
            });
            hint.addEventListener('mouseleave', function() {
                if (!bar.classList.contains('active')) this.style.color = '#888';
            });

            input.addEventListener('input', function() {
                var kw = this.value.toLowerCase().trim();
                if (!kw) {
                    results.classList.remove('active');
                    mainList.style.display = 'grid';
                    return;
                }
                mainList.style.display = 'none';
                results.classList.add('active');
                var matched = allFiles.filter(function(f) {
                    return decodeFilename(f.name).toLowerCase().includes(kw);
                });
                if (matched.length) {
                    list.innerHTML = matched.map(function(f) {
                        var originalUrl = f.browser_download_url;
                        return '<div class="file-item" onclick="downloadFile(\'' + originalUrl + '\', \'' + f.name + '\')"><div class="file-icon"></div><div class="file-name">' + escapeHtml(decodeFilename(f.name)) + '</div><div class="file-details">' + formatSize(f.size) + ' | 点击下载</div></div>';
                    }).join('');
                } else {
                    list.innerHTML = '<div style="text-align:center;padding:40px">😔 没有找到相关文件</div>';
                }
            });
        }

        document.getElementById('navToggle').addEventListener('click', function() {
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        document.getElementById('sidebarOverlay').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            this.classList.remove('active');
        });

        document.getElementById('backButton').addEventListener('click', function() { history.back(); });
        document.getElementById('forwardButton').addEventListener('click', function() { history.forward(); });

        document.getElementById('selectModeBtn').addEventListener('click', enterSelectMode);
        document.getElementById('exitSelectModeBtn').addEventListener('click', exitSelectMode);
        document.getElementById('selectAllBtn').addEventListener('click', selectAll);
        document.getElementById('clearSelectionBtn').addEventListener('click', clearSel);
        document.getElementById('downloadSelectedBtn').addEventListener('click', showBatchModal);
        document.getElementById('confirmDownload').addEventListener('click', batchDownloadBrowser);
        document.getElementById('cancelDownload').addEventListener('click', closeModal);

        document.getElementById('proxySelect').addEventListener('change', function() {
            const val = this.value;
            isProxyAuto = (val === 'auto');
            if (val === 'auto') {
                const statusEl = document.getElementById('proxyStatus');
                statusEl.textContent = '🤖 自动模式 (使用 ' + bestProxyKey + ')';
                statusEl.className = 'proxy-status success';
                showProxyTip('🔄 切换到自动模式，当前最快: ' + bestProxyKey);
            } else if (val === 'none') {
                showProxyTip('🌍 切换到直连模式');
            } else {
                showProxyTip('🔗 手动切换到: ' + val);
            }
            updateZipLinks();
            renderFiles();
        });

        document.getElementById('speedTestBtn').addEventListener('click', function() {
            speedTest();
        });

        (async function init() {
            const statusEl = document.getElementById('proxyStatus');
            statusEl.textContent = '⏳ 检测IP...';
            statusEl.className = 'proxy-status loading';

            const country = await detectCountry();
            if (country === 'CN') {
                statusEl.textContent = '🇨🇳 国内用户';
                showProxyTip('🇨🇳 检测到您在中国，将自动选择国内加速代理');
            } else if (country === 'OTHER' && sessionStorage.getItem('userCountry') === 'OTHER') {
                statusEl.textContent = '🌍 国外 / 检测失败';
                statusEl.className = 'proxy-status error';
                showProxyTip('⚠️ IP检测失败，已切换至直连模式，你可手动选择代理', true);
            } else {
                statusEl.textContent = '🌍 国外用户';
                showProxyTip('🌍 检测到您在境外，已切换至直连模式');
            }

            await loadFiles();
            initSearch();

            statusEl.textContent = '⏳ 测速中...';
            statusEl.className = 'proxy-status loading';
            await speedTest();
            updateZipLinks();

            if (getSelectedProxyKey() === 'auto') {
                statusEl.textContent = '🤖 自动 (' + bestProxyKey + ')';
                statusEl.className = 'proxy-status success';
            }

            console.log('✅ 初始化完成，当前代理:', getSelectedProxyKey(), '最佳:', bestProxyKey);
        })();
    </script>
</body>
</html>
