    <style>
        /* ===== 页面特有样式 ===== */
        .file-stats {
            background: rgba(20,20,30,0.7);

        }

        .download-progress.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s;
        }

        .proxy-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 8px 15px;
            background: rgba(20,20,30,0.7);
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .proxy-toggle label {
            color: #aaa;
            font-size: 14px;
        }

        .proxy-toggle select, .proxy-toggle button {
            background: rgba(0,0,0,0.4);
            border: 1px solid #4CAF50;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;

        }

        .proxy-toggle button:hover {
            background: #4CAF50;
        }

        .proxy-status {
            font-size: 12px;
            color: #aaa;
            margin-left: 10px;
        }

        .proxy-status.success {
            color: #4CAF50;
        }

        .proxy-status.error {
            color: #f44336;
        }

        .proxy-status.loading {
            color: #ff9800;
        }

        .zip-buttons {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
            align-items: center;
        }

        .zip-btn {
            background: rgba(255,152,0,0.2);
            border: 1px solid #ff9800;
            color: #ff9800;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .zip-btn:hover {
            background: rgba(255,152,0,0.4);
        }

        /* 多选模式 */
        .file-item.selectable {
            cursor: pointer;
        }

        .file-item.selected::after {
            content: "✓";
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: #4CAF50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .batch-controls {
                flex-direction: column;
            }
            .batch-btn {
                width: 100%;
                justify-content: center;
            }
            .file-list {
                grid-template-columns: 1fr;
            }
            .proxy-tip {
                bottom: 15px;
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  ██████  windows-virus.html 独立脚本  ██████
        //  包含：代理检测、文件列表、多选、批量下载、搜索
        // ================================================================

        // ===================== 配置 =====================
        const PROXY_MAP = {
            'gh-proxy.org': 'https://gh-proxy.org/',
            'ghproxy.net': 'https://ghproxy.net/',
            'gh-proxy.com': 'https://gh-proxy.com/',
            'ghproxy.cc': 'https://ghproxy.cc/'
        };
        const DEFAULT_PROXY_KEY = 'gh-proxy.org';

        let userCountry = 'OTHER';
        let allFiles = [];
        let filteredFiles = [];
        let selectedFiles = new Set();
        let selectMode = false;
        let bestProxyKey = DEFAULT_PROXY_KEY;
        let isProxyAuto = true;

        // ===================== DOM 引用 =====================
        const container = document.getElementById('fileList');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const resultsList = document.getElementById('resultsList');
        const searchToggle = document.getElementById('searchToggle');
        const searchBar = document.getElementById('searchBar');
        const proxySelect = document.getElementById('proxySelect');
        const proxyStatus = document.getElementById('proxyStatus');
        const speedTestBtn = document.getElementById('speedTestBtn');
        const fileStats = document.getElementById('fileStats');
        const zipLink = document.getElementById('zipLink');
        const tarLink = document.getElementById('tarLink');
        const selectModeBtn = document.getElementById('selectModeBtn');
        const downloadSelectedBtn = document.getElementById('downloadSelectedBtn');
        const selectedCount = document.getElementById('selectedCount');
        const selectedCounter = document.getElementById('selectedCounter');
        const batchToolbar = document.getElementById('batchToolbar');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const clearSelectionBtn = document.getElementById('clearSelectionBtn');
        const exitSelectModeBtn = document.getElementById('exitSelectModeBtn');
        const batchModal = document.getElementById('batchModal');
        const modalSelectedCount = document.getElementById('modalSelectedCount');
        const modalFileList = document.getElementById('modalFileList');
        const confirmDownload = document.getElementById('confirmDownload');
        const cancelDownload = document.getElementById('cancelDownload');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');

        // ===================== 解码 =====================
        function decodeFilename(encoded) {
            if (!encoded) return encoded;
            try {
                let lastDot = encoded.lastIndexOf('.');
                let ext = lastDot > 0 ? encoded.substring(lastDot) : '';
                let name = lastDot > 0 ? encoded.substring(0, lastDot) : encoded;
                let base64 = name.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                let decoded = atob(base64);
                decoded = decodeURIComponent(escape(decoded));
                return decoded + ext;
            } catch(e) { return encoded; }
        }

        function formatSize(bytes) {
            if (!bytes) return '未知';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
            });
        }

        // ================================================================
        //  🔥 IP 检测（并行 + 超时 + 缓存）
        // ================================================================
        async function detectCountry() {
            const cached = sessionStorage.getItem('userCountry');
            if (cached) {
                userCountry = cached;
                return cached;
            }

            const apis = [
                { url: 'https://ipapi.co/json/', parser: (d) => d.country_code || d.country || '' },
                { url: 'https://ipinfo.io/json', parser: (d) => d.country || '' },
                { url: 'https://api.ipify.org?format=json', parser: () => '' }
            ];

            const fetchWithTimeout = (url, timeout = 3000) => {
                return Promise.race([
                    fetch(url),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('超时')), timeout))
                ]);
            };

            const promises = apis.map(async (api) => {
                try {
                    const res = await fetchWithTimeout(api.url);
                    if (!res.ok) return null;
                    const data = await res.json();
                    const country = api.parser(data);
                    if (country && country.length === 2) {
                        return country.toUpperCase();
                    }
                    return null;
                } catch {
                    return null;
                }
            });

            const results = await Promise.all(promises);
            for (let result of results) {
                if (result) {
                    userCountry = result;
                    sessionStorage.setItem('userCountry', result);
                    return result;
                }
            }

            userCountry = 'OTHER';
            sessionStorage.setItem('userCountry', 'OTHER');
            return 'OTHER';
        }

        // ================================================================
        //  🔥 真实测速
        // ================================================================
        async function speedTest() {
            const statusEl = proxyStatus;
            statusEl.textContent = '⏳ 测速中...';
            statusEl.className = 'proxy-status loading';

            const testFile = 'https://github.com/xiaozhongziyuanku2025/xiaozhongziyuanku2025/releases/download/Windows%E7%97%85%E6%AF%92%E5%BA%93/0Y4.exe';
            const proxyKeys = Object.keys(PROXY_MAP);
            const results = {};

            const testPromises = proxyKeys.map(async (key) => {
                const url = PROXY_MAP[key] + testFile;
                const start = performance.now();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(url, {
                        signal: controller.signal,
                        headers: { 'Range': 'bytes=0-1024' }
                    });
                    clearTimeout(timeoutId);
                    if (!res.ok) { results[key] = Infinity; return; }
                    const reader = res.body.getReader();
                    await reader.read();
                    reader.releaseLock();
                    results[key] = performance.now() - start;
                } catch {
                    results[key] = Infinity;
                }
            });

            await Promise.allSettled(testPromises);

            const valid = Object.keys(results).filter(k => results[k] !== Infinity);
            if (valid.length === 0) {
                bestProxyKey = DEFAULT_PROXY_KEY;
                statusEl.textContent = '⚠️ 测速失败，使用默认代理';
                statusEl.className = 'proxy-status error';
                return;
            }

            valid.sort((a, b) => results[a] - results[b]);
            bestProxyKey = valid[0];
            const latency = Math.round(results[bestProxyKey]);

            statusEl.textContent = '✅ 最快: ' + bestProxyKey + ' (' + latency + 'ms)';
            statusEl.className = 'proxy-status success';

            if (isProxyAuto) {
                proxySelect.value = 'auto';
                renderFiles();
                updateZipLinks();
                showProxyTip('🚀 自动切换到最快代理: ' + bestProxyKey + ' (' + latency + 'ms)');
            }
        }

        // ================================================================
        //  提示条
        // ================================================================
        function showProxyTip(msg, isError = false) {
            const existing = document.querySelector('.proxy-tip');
            if (existing) existing.remove();

            const tip = document.createElement('div');
            tip.className = 'proxy-tip';
            tip.innerHTML = `
                <span class="tip-icon">${isError ? '⚠️' : '✅'}</span>
                <span>${msg}</span>
                <span class="tip-close">&times;</span>
            `;
            if (isError) tip.style.borderColor = 'rgba(244,67,54,0.5)';
            document.body.appendChild(tip);

            tip.querySelector('.tip-close').addEventListener('click', function() {
                tip.remove();
            });

            setTimeout(() => { if (tip.parentNode) tip.remove(); }, 8000);
        }

        // ================================================================
        //  代理逻辑
        // ================================================================
        function getProxyPrefix(key) {
            if (key === 'none') return '';
            if (key === 'auto') return PROXY_MAP[bestProxyKey] || '';
            return PROXY_MAP[key] || '';
        }

        function getDownloadUrl(originalUrl) {
            const mode = proxySelect.value;
            const prefix = getProxyPrefix(mode);
            return prefix ? prefix + originalUrl : originalUrl;
        }

        // ================================================================
        //  压缩包
        // ================================================================
        function updateZipLinks() {
            const base = 'https://github.com/xiaozhongziyuanku2025/xiaozhongziyuanku2025/archive/refs/heads/main';
            const prefix = getProxyPrefix(proxySelect.value);
            zipLink.href = (prefix ? prefix : '') + base + '.zip';
            tarLink.href = (prefix ? prefix : '') + base + '.tar.gz';
        }

        // ================================================================
        //  下载
        // ================================================================
        function downloadFile(originalUrl, encodedName) {
            const finalUrl = getDownloadUrl(originalUrl);
            const a = document.createElement('a');
            a.href = finalUrl;
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // ================================================================
        //  渲染文件列表
        // ================================================================
        function renderFiles() {
            const list = filteredFiles.length ? filteredFiles : allFiles;

            if (!list.length) {
                container.innerHTML = '<div class="loading">📁 暂无文件</div>';
                fileStats.innerHTML = '📁 暂无文件';
                return;
            }

            fileStats.innerHTML = '<i class="fas fa-chart-bar"></i> 共 ' + list.length + ' 个文件';

            container.innerHTML = list.map(function(file) {
                const decoded = decodeFilename(file.name);
                const isSel = selectedFiles.has(file);
                const originalUrl = file.browser_download_url;
                return `
                    <div class="file-item ${selectMode ? 'selectable' : ''} ${isSel ? 'selected' : ''}"
                         data-filename="${escapeHtml(file.name)}"
                         data-url="${escapeHtml(originalUrl)}">
                        <div class="file-icon"></div>
                        <div class="file-name">${escapeHtml(decoded)}</div>
                        <div class="file-details">${formatSize(file.size)} ${selectMode ? '| 点击选中' : '| 点击下载'}</div>
                    </div>
                `;
            }).join('');

            bindEvents();
        }

        function bindEvents() {
            document.querySelectorAll('#fileList .file-item').forEach(function(item) {
                item.removeEventListener('click', handleClick);
                item.addEventListener('click', handleClick);
            });
        }

        function handleClick(e) {
            const item = e.currentTarget;
            const originalUrl = item.dataset.url;
            const filename = item.dataset.filename;

            if (selectMode) {
                const file = allFiles.find(function(f) { return f.name === filename; });
                if (!file) return;
                if (selectedFiles.has(file)) {
                    selectedFiles.delete(file);
                    item.classList.remove('selected');
                } else {
                    selectedFiles.add(file);
                    item.classList.add('selected');
                }
                updateUI();
            } else {
                if (originalUrl && filename) downloadFile(originalUrl, filename);
            }
        }

        // ================================================================
        //  多选 UI
        // ================================================================
        function updateUI() {
            const count = selectedFiles.size;
            selectedCounter.innerText = count;
            selectedCount.innerText = count;
            downloadSelectedBtn.style.display = count > 0 ? 'flex' : 'none';
        }

        function enterSelectMode() {
            selectMode = true;
            selectModeBtn.style.display = 'none';
            batchToolbar.classList.add('active');
            renderFiles();
            updateUI();
        }

        function exitSelectMode() {
            selectMode = false;
            selectedFiles.clear();
            selectModeBtn.style.display = 'flex';
            batchToolbar.classList.remove('active');
            renderFiles();
            updateUI();
        }

        function selectAll() {
            const list = filteredFiles.length ? filteredFiles : allFiles;
            list.forEach(function(f) { selectedFiles.add(f); });
            renderFiles();
            updateUI();
        }

        function clearSel() {
            selectedFiles.clear();
            renderFiles();
            updateUI();
        }

        // ================================================================
        //  批量下载
        // ================================================================
        function showBatchModal() {
            if (selectedFiles.size === 0) return;
            modalSelectedCount.innerText = selectedFiles.size;
            modalFileList.innerHTML = '';
            selectedFiles.forEach(function(f) {
                const div = document.createElement('div');
                div.className = 'selected-item';
                div.innerHTML = '<i class="fas fa-file"></i> ' + escapeHtml(decodeFilename(f.name));
                modalFileList.appendChild(div);
            });
            batchModal.classList.add('active');
        }

        function closeModal() { batchModal.classList.remove('active'); }

        function batchDownloadBrowser() {
            const files = Array.from(selectedFiles);
            if (files.length === 0) return;
            showProxyTip('📥 正在打开 ' + files.length + ' 个下载链接...');
            progressBar.classList.add('active');
            let completed = 0;
            files.forEach(function(file, i) {
                setTimeout(function() {
                    window.open(getDownloadUrl(file.browser_download_url), '_blank');
                    completed++;
                    progressFill.style.width = (completed / files.length * 100) + '%';
                    progressText.innerText = '已打开 ' + completed + '/' + files.length + ' 个下载';
                    if (completed === files.length) {
                        setTimeout(function() { progressBar.classList.remove('active'); }, 2000);
                    }
                }, i * 600);
            });
            closeModal();
        }

        // ================================================================
        //  加载文件
        // ================================================================
        async function loadFiles() {
            try {
                const res = await fetch('release-cache.json?_=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (data.assets && data.assets.length) {
                        allFiles = data.assets;
                        filteredFiles = [...allFiles];
                        renderFiles();
                        return;
                    }
                }
                const apiRes = await fetch('https://api.github.com/repos/xiaozhongziyuanku2025/xiaozhongziyuanku2025/releases/tags/Windows病毒库');
                if (apiRes.ok) {
                    const apiData = await apiRes.json();
                    if (apiData.assets && apiData.assets.length) {
                        allFiles = apiData.assets;
                        filteredFiles = [...allFiles];
                        renderFiles();
                        return;
                    }
                }
                throw new Error('无数据');
            } catch(e) {
                container.innerHTML = '<div class="error">加载失败，请刷新或稍后再试</div>';
                fileStats.innerHTML = '加载失败';
            }
        }

        // ================================================================
        //  搜索（本页面独立）
        // ================================================================
        function initSearch() {
            searchToggle.addEventListener('click', function() {
                searchBar.classList.toggle('active');
                if (searchBar.classList.contains('active')) {
                    searchInput.focus();
                    document.getElementById('searchHint').style.display = 'none';
                } else {
                    searchInput.value = '';
                    searchResults.classList.remove('active');
                    document.getElementById('searchHint').style.display = 'inline';
                }
            });

            searchInput.addEventListener('input', function() {
                const kw = this.value.trim().toLowerCase();
                if (!kw) {
                    searchResults.classList.remove('active');
                    container.style.display = 'grid';
                    return;
                }
                container.style.display = 'none';
                const matched = allFiles.filter(function(f) {
                    return decodeFilename(f.name).toLowerCase().includes(kw);
                });
                if (matched.length) {
                    resultsList.innerHTML = matched.map(function(f) {
                        const originalUrl = f.browser_download_url;
                        return `
                            <div class="file-item" onclick="downloadFile('${originalUrl}', '${f.name}')">
                                <div class="file-icon"></div>
                                <div class="file-name">${escapeHtml(decodeFilename(f.name))}</div>
                                <div class="file-details">${formatSize(f.size)} | 点击下载</div>
                            </div>
                        `;
                    }).join('');
                    searchResults.classList.add('active');
                } else {
                    resultsList.innerHTML = '<div style="text-align:center;padding:40px">😔 没有找到相关文件</div>';
                    searchResults.classList.add('active');
                }
            });
        }

        // ================================================================
        //  导航
        // ================================================================
        document.getElementById('navToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        });

        document.getElementById('sidebarOverlay').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            this.classList.remove('active');
        });

        document.getElementById('backButton').addEventListener('click', function() { history.back(); });
        document.getElementById('forwardButton').addEventListener('click', function() { history.forward(); });

        // ================================================================
        //  按钮绑定
        // ================================================================
        selectModeBtn.addEventListener('click', enterSelectMode);
        exitSelectModeBtn.addEventListener('click', exitSelectMode);
        selectAllBtn.addEventListener('click', selectAll);
        clearSelectionBtn.addEventListener('click', clearSel);
        downloadSelectedBtn.addEventListener('click', showBatchModal);
        confirmDownload.addEventListener('click', batchDownloadBrowser);
        cancelDownload.addEventListener('click', closeModal);

        // 代理切换
        proxySelect.addEventListener('change', function() {
            const val = this.value;
            isProxyAuto = (val === 'auto');
            if (val === 'auto') {
                proxyStatus.textContent = '🤖 自动模式 (使用 ' + bestProxyKey + ')';
                proxyStatus.className = 'proxy-status success';
            } else if (val === 'none') {
                proxyStatus.textContent = '🌍 直连模式';
                proxyStatus.className = 'proxy-status';
            } else {
                proxyStatus.textContent = '🔗 手动: ' + val;
                proxyStatus.className = 'proxy-status';
            }
            updateZipLinks();
            renderFiles();
        });

        speedTestBtn.addEventListener('click', speedTest);

        // ================================================================
        //  🚀 启动
        // ================================================================
        (async function init() {
            proxyStatus.textContent = '⏳ 检测IP...';
            proxyStatus.className = 'proxy-status loading';

            const country = await detectCountry();
            if (country === 'CN') {
                proxyStatus.textContent = '🇨🇳 国内用户';
                showProxyTip('🇨🇳 检测到您在中国，将自动选择国内加速代理');
            } else if (country === 'OTHER' && sessionStorage.getItem('userCountry') === 'OTHER') {
                proxyStatus.textContent = '🌍 国外 / 检测失败';
                proxyStatus.className = 'proxy-status error';
                showProxyTip('⚠️ IP检测失败，已切换至直连模式', true);
            } else {
                proxyStatus.textContent = '🌍 国外用户';
                showProxyTip('🌍 检测到您在境外，已切换至直连模式');
            }

            await loadFiles();
            initSearch();

            proxyStatus.textContent = '⏳ 测速中...';
            proxyStatus.className = 'proxy-status loading';
            await speedTest();

            updateZipLinks();

            if (proxySelect.value === 'auto') {
                proxyStatus.textContent = '🤖 自动 (' + bestProxyKey + ')';
                proxyStatus.className = 'proxy-status success';
            }

            console.log('✅ 初始化完成');
        })();
    </script>
</body>
</html>
